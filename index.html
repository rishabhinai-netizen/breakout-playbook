<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Breakout Playbook — private</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F5F4EF;--paper:#fff;--ink:#25272A;--ink2:#4A4D52;--mute:#7A7D82;--rule:#DEDBD2;--amber:#C8940A;--loss:#B0412E}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
.box{max-width:440px;width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:28px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}p{color:var(--ink2);margin:0 0 16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--amber);margin-right:8px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--rule);border-radius:8px;margin-bottom:10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button{width:100%;font:600 15px inherit;font-family:inherit;padding:11px;border:0;border-radius:8px;background:var(--ink);color:#fff;cursor:pointer}
label.r{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);margin:0 0 14px}label.r input{width:auto;margin:0}
.err{color:var(--loss);font-size:13px;min-height:20px;margin-top:8px}
.disc{font-size:12px;color:var(--mute);margin:18px 0 0;border-top:1px solid var(--rule);padding-top:12px}
progress{width:100%;height:6px;margin:6px 0 0;accent-color:#C8940A}.st{font-size:13px;color:var(--mute);min-height:20px}
button:disabled{opacity:.6;cursor:wait}</style></head><body>
<form class="box" id="f" autocomplete="off" action="javascript:void(0)" onsubmit="window.__pending=1;if(window.__go)window.__go();return false">
<h1><span class="dot"></span>Breakout Playbook</h1>
<p>Private research for friends. Enter the password to open.</p>
<input type="password" id="pw" placeholder="Password" aria-label="Password" autofocus>
<label class="r"><input type="checkbox" id="rem"> Remember on this device</label>
<button type="submit" id="go">Open</button>
<div class="st" id="st" aria-live="polite"></div>
<progress id="pg" max="100" value="0" hidden></progress>
<div class="err" id="err" role="alert"></div>
<p class="disc">Educational research only — not investment advice. The author is not a SEBI-registered Research Analyst or Investment Adviser. Use at your own risk.</p>
</form>
<script>
(()=>{
const S="9Vff7OwkSRP0J9aqUNwRJA==",I="TXNzmsRbAnlOvqOU",IT=200000;
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), $=id=>document.getElementById(id);
let dataP=null;
function load(){ if(dataP) return dataP;
 dataP=(async()=>{const r=await fetch("data.bin?v=20260925",{cache:"no-cache"}); if(!r.ok) throw new Error("net");
  const tot=+r.headers.get("content-length")||0, rd=r.body.getReader(), parts=[]; let got=0;
  for(;;){const {done,value}=await rd.read(); if(done)break; parts.push(value); got+=value.length; if(tot){$("pg").hidden=false;$("pg").value=Math.min(100,got/tot*100)}}
  const out=new Uint8Array(got); let o=0; for(const p of parts){out.set(p,o);o+=p.length} return out;})();
 dataP.catch(()=>{dataP=null}); return dataP;}
load();
async function open_(pw){
 $("st").textContent="Loading data…"; const ct=await load();
 $("st").textContent="Unlocking…";
 const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:IT,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
 let pt; try{pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},k,ct)}catch(_){throw new Error("pw")}
 const html=new TextDecoder().decode(pt); document.open(); document.write(html); document.close();
}
async function go(pw,remember){const btn=$("go"); btn.disabled=true; btn.textContent="Opening…"; $("err").textContent="";
 try{await open_(pw); if(remember){try{localStorage.setItem("bp_pw",pw)}catch(_){}}}
 catch(e){$("st").textContent=""; $("pg").hidden=true; $("err").textContent=e.message==="pw"?"That password didn't work.":"Couldn't load the data — check your connection and try again."; btn.disabled=false; btn.textContent="Open"; try{localStorage.removeItem("bp_pw")}catch(_){}}}
let busy=false; window.__go=()=>{window.__pending=0; const pw=$("pw").value; if(pw&&!busy){busy=true; go(pw,$("rem").checked).finally(()=>{busy=false})}}; if(window.__pending) window.__go();
let saved=null; try{saved=localStorage.getItem("bp_pw")}catch(_){} if(saved) go(saved,false);
})();
</script></body></html>
